{%- assign cg_here = page.url | replace: '.html', '' -%}
<header class="site-header" id="site-header">
  <div class="container nav-inner">
    <a href="/" class="brand" aria-label="CloudGate Storage home">
      <img src="/assets/img/cg-mark-128.webp" alt="" class="brand-mark" width="40" height="40" decoding="async">
      <span class="brand-name">CloudGate Storage<sup class="rmark">&reg;</sup></span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="/features"{% if cg_here == '/features' %} aria-current="page"{% endif %}><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Features</a>
      <a href="/cloud-tips"{% if cg_here == '/cloud-tips' %} aria-current="page"{% elsif page.parent_url == '/cloud-tips' %} aria-current="true"{% endif %}><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-6 6c0 2.3 1.3 3.6 2.3 4.6.7.7 1.2 1.3 1.2 2.4h5c0-1.1.5-1.7 1.2-2.4C16.7 12.6 18 11.3 18 9a6 6 0 00-6-6z"/></svg>Cloud Tips</a>
      <a href="{{ site.data.links.web_app }}" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>Web App</a>
    </nav>
    <div class="nav-end">
      <a href="{{ site.data.links.web_app }}" target="_blank" rel="noopener" class="btn btn-primary btn-sm header-cta">Get Started for Free<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="container">
    <nav class="mobile-menu" id="mobile-menu" aria-label="Menu">
      <a href="/features" class="mnav-row"{% if cg_here == '/features' %} aria-current="page"{% endif %}>
        <svg class="mnav-ico ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
        <span class="mnav-label">Features</span>
      </a>
      <a href="/cloud-tips" class="mnav-row"{% if cg_here == '/cloud-tips' %} aria-current="page"{% endif %}>
        <svg class="mnav-ico ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.3.3.5.7.5 1.1h6c0-.4.2-.8.5-1.1A6 6 0 0012 3z"/></svg>
        <span class="mnav-label">Cloud Tips</span>
      </a>
      <a href="{{ site.data.links.web_app }}" target="_blank" rel="noopener" class="mnav-row">
        <svg class="mnav-ico ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20h8M12 17v3"/></svg>
        <span class="mnav-label">Web App</span>
        <svg class="mnav-ext ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
      </a>
      <div class="mnav-foot">
        <a href="{{ site.data.links.web_app }}" target="_blank" rel="noopener" class="btn btn-primary btn-lg btn-block">Get Started for Free<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <p class="mnav-note">100GB free, no card required</p>
      </div>
    </nav>
  </div>
</header>
<div class="nav-backdrop" id="nav-backdrop" hidden></div>
