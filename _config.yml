title: CloudGate Storage
description: 100GB free cloud storage for Android, iPhone and web.
url: https://cloudgate-app.com
lang: en-AU
locale: en_AU

# Staging switch. While true, every page carries noindex and robots.txt
# blocks all crawlers, so this copy (served at cloudgate.fixmypcperth.com)
# can never be indexed or compete with the live cloudgate-app.com.
# Set to false only when this repo becomes the live site.
staging: true

# Pages are plain .html files; Jekyll only assembles layout and includes.
# GitHub Pages builds in safe mode, so no custom plugins: canonicals, schema
# and the sitemap are all generated by Liquid in _includes/ and sitemap.xml.
plugins: []

exclude:
  - README.md
  - legal-info-required.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Every guide is an Article, sits under Cloud Tips in the breadcrumb and
  # uses the guide stylesheet. Per-guide front matter only needs title,
  # description, crumb, last_modified_at and faq.
  - scope:
      path: "guides"
    values:
      type: article
      extra_css: /assets/css/guide.css
      parent_title: Cloud Tips
      parent_url: /cloud-tips
